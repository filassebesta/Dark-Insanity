<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .14  0 0 0 .28 0"/>
  </filter>
  <filter id="stains" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .40  0 0 0 0 .20  1.1 0 0 0 -.45"/>
  </filter>
  <rect width="320" height="320" fill="#e6d5b0"/>
  <rect width="320" height="320" filter="url(#stains)" opacity=".55"/>
  <rect width="320" height="320" filter="url(#grain)"/>
</svg>
